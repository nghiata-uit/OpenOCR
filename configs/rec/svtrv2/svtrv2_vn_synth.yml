Global:
  device: gpu
  epoch_num: 10
  log_smooth_window: 20
  print_batch_step: 20
  output_dir: ./output/rec/vn/svtrv2_vn_synth/
  save_epoch_step: [5, 1]
  eval_batch_step: [0, 500]
  eval_epoch_step: [0, 1]
  cal_metric_during_train: True
  # Tận dụng checkpoint tốt nhất hiện có để finetune tiếp
  pretrained_model: ./best.pth
  checkpoints:
  use_tensorboard: false
  infer_img:
  character_dict_path: &character_dict_path ./tools/utils/vn_dict.txt
  max_text_length: &max_text_length 64
  use_space_char: &use_space_char True
  save_res_path: ./output/rec/vn/svtrv2_vn_synth/predicts_svtrv2_vn_synth.txt
  use_amp: True

Optimizer:
  name: AdamW
  lr: 0.00002
  weight_decay: 0.05
  filter_bias_and_bn: False

LRScheduler:
  name: CosineAnnealingLR
  warmup_epoch: 1
  cycle_momentum: False

Architecture:
  model_type: rec
  algorithm: SVTRv2
  in_channels: 3
  Transform:
  Encoder:
    name: SVTRv2LNConvTwo33
    use_pos_embed: False
    dims: [128, 256, 384]
    depths: [6, 6, 6]
    num_heads: [4, 8, 12]
    mixer: [['Conv','Conv','Conv','Conv','Conv','Conv'],['Conv','Conv','FGlobal','Global','Global','Global'],['Global','Global','Global','Global','Global','Global']]
    local_k: [[5, 5], [5, 5], [-1, -1]]
    sub_k: [[1, 1], [2, 1], [-1, -1]]
    last_stage: false
  Decoder:
    name: GTC
    max_text_length: *max_text_length
    sub_str_len: &subsl 3
    rec_num_classes: 230
    use_space_char: *use_space_char
    character_dict_path: *character_dict_path
    c_dim: 384
    refine_stage: 1

Loss:
  name: Combined
  loss_config_list:
    - GTCLoss:
        name: SMTRLoss
        sub_str_len: *subsl
    - CTCLoss:
        use_focal_loss: False
        weight: 0.1

PostProcess:
  name: GTCLabelDecode
  character_dict_path: *character_dict_path
  use_space_char: *use_space_char

Metric:
  name: RecGTCMetric
  main_indicator: acc
  is_filter: True

Train:
  dataset:
    name: MultiScaleDataSet
    ds_width: True
    data_dir: ./synth_vn_data/
    label_file_list:
      - ./synth_vn_data/rec_gt_train.txt
    transforms:
      - DecodeImagePIL:
          img_mode: RGB
      - PARSeqAugPIL:
      - GTCLabelEncode:
          gtc_label_encode:
            name: SMTRLabelEncode
            sub_str_len: *subsl
          character_dict_path: *character_dict_path
          use_space_char: *use_space_char
          max_text_length: *max_text_length
      - KeepKeys:
          keep_keys: ['image', 'label', 'label_subs', 'label_next', 'length_subs',
          'label_subs_pre', 'label_next_pre', 'length_subs_pre', 'length', 'ctc_label', 'ctc_length']
  sampler:
    name: RatioSampler
    scales: [[128, 32]]
    first_bs: &bs 256
    fix_bs: false
    divided_factor: [4, 16]
    is_training: True
  loader:
    shuffle: True
    batch_size_per_card: *bs
    drop_last: True
    max_ratio: &max_ratio 12
    num_workers: 8

Eval:
  dataset:
    name: MultiScaleDataSet
    ds_width: True
    data_dir: ./synth_vn_data/
    label_file_list:
      - ./synth_vn_data/rec_gt_val.txt
    transforms:
      - DecodeImagePIL:
          img_mode: RGB
      - GTCLabelEncode:
          gtc_label_encode:
            name: ARLabelEncode
          character_dict_path: *character_dict_path
          use_space_char: *use_space_char
          max_text_length: *max_text_length
      - KeepKeys:
          keep_keys: ['image', 'label', 'length', 'ctc_label', 'ctc_length']
  sampler:
    name: RatioSampler
    scales: [[128, 32]]
    first_bs: *bs
    fix_bs: false
    divided_factor: [4, 16]
    is_training: False
  loader:
    shuffle: False
    drop_last: False
    batch_size_per_card: *bs
    max_ratio: *max_ratio
    num_workers: 8
